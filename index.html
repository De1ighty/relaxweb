<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>小胖的直播间</title>

<link rel="stylesheet" href="assets/styles.css">

</head>


<body>


<!-- ======================================================
     顶部
====================================================== -->

<header class="header">

<div class="left-header">

    <div class="logo">
        小胖 Live
    </div>

    <div class="online-stat">
        <span class="online-stat-number" id="onlineNumber">0</span>
        <span class="online-stat-name">在线观众</span>
    </div>

</div>


<div class="user-area">

    <button
        class="login-button"
        id="loginButton"
    >
        登录
    </button>

    <div
        class="user-avatar"
        id="userAvatar"
    >
        U
    </div>

    <div
        class="user-name"
        id="userName"
    >
    </div>

</div>

</header>



<!-- ======================================================
     主页面
====================================================== -->

<div class="container">

<div class="live-layout">


<!-- ======================================================
     左侧
====================================================== -->

<div>


<div class="video-card">


<!-- 播放器 -->

<div
    class="player"
    id="player"
>

<div class="player-stage">

<video
    id="streamVideo"
    autoplay
    playsinline
></video>

<div class="player-message" id="playerMessage">
    正在连接直播…
</div>


<!-- 弹幕层 -->

<div
    class="danmaku-layer"
    id="danmakuLayer"
></div>


<!-- LIVE -->

<div class="live-overlay">

    <div class="live-badge">
        LIVE
    </div>

    <div class="viewer-badge">

        👤

        <span id="viewerCount">
            0
        </span>

        人正在观看

    </div>

</div>


<!-- 播放器工具 -->

<div class="player-tools" id="playerTools">

    <div class="player-tool-group player-tools-left">
        <button class="player-tool" id="playToggle" type="button" title="播放" aria-label="播放">
            ▶
        </button>
    </div>

    <div class="player-tool-group player-tools-right">
        <button class="player-tool" id="muteToggle" type="button" title="静音" aria-label="静音">
            🔊
        </button>

        <input
            class="volume-slider"
            id="volumeSlider"
            type="range"
            min="0"
            max="1"
            step="0.05"
            value="1"
            aria-label="音量"
        >

        <button
            class="player-tool active"
            id="danmakuToggle"
            type="button"
            title="关闭弹幕"
            aria-label="关闭弹幕"
        >
            💬
        </button>

        <button
            class="player-tool"
            id="fullscreenButton"
            type="button"
            title="进入全屏"
            aria-label="进入全屏"
        >
            ⤢
        </button>
    </div>

</div>

</div>

</div>





</div>



</div>


<!-- ======================================================
     聊天室
====================================================== -->

<div class="chat-card" id="chatCard">


<div class="chat-header">

    <div class="chat-title">
        直播聊天
    </div>

    <div
        class="chat-status"
        id="chatStatus"
    >
        ● 连接中
    </div>

</div>



<div class="notice">

    <strong>
        📌 直播间公告
    </strong>

    <br>

    文明聊天，友好交流，不要刷屏哦～

</div>



<div
    class="messages"
    id="messages"
>

    <div class="message">

        <div class="message-avatar">
            ·
        </div>

        <div>

            <div class="message-user">
                系统
            </div>

            <div class="message-text">
                正在连接聊天室……
            </div>

        </div>

    </div>

</div>

<div class="danmaku-composer" id="danmakuComposer">
    <span class="danmaku-composer-label">弹幕</span>
    <input
        class="chat-input"
        id="chatInput"
        maxlength="200"
        placeholder="登录后发送弹幕..."
        aria-label="弹幕内容"
    >
    <button
        class="send-button"
        id="sendButton"
        type="button"
    >
        发送
    </button>
</div>


</div>


</div>

</div>



<!-- ======================================================
     登录注册窗口
====================================================== -->

<div
    class="modal"
    id="loginModal"
>

<div class="login-card">


<h2 id="authTitle">
    登录直播间
</h2>


<input
    class="login-input"
    id="username"
    maxlength="20"
    autocomplete="username"
    placeholder="用户名"
>


<input
    class="login-input"
    id="password"
    type="password"
    maxlength="128"
    autocomplete="current-password"
    placeholder="密码"
>


<button
    class="login-submit"
    id="authSubmit"
    type="button"
>
    登录
</button>


<div
    class="auth-switch"
    id="authSwitch"
>

    还没有账号？

    <span class="auth-link">
        注册
    </span>

</div>


</div>

</div>



<script src="assets/reader.js" defer></script>
<script src="assets/app.js" defer></script>


</body>

</html>
