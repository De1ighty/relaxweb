<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>小胖的直播间</title>

<style>

/* =========================================================
   全局
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    color: #1d1d1f;

    background:
        radial-gradient(circle at 10% 0%, #fff0f6, transparent 30%),
        radial-gradient(circle at 90% 15%, #edf4ff, transparent 30%),
        #f5f5f7;
}

button,
input {
    font: inherit;
}


/* =========================================================
   顶部导航栏
========================================================= */

.header {
    height: 68px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 30px;

    position: sticky;
    top: 0;

    z-index: 100;

    background: rgba(255,255,255,.78);

    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);

    border-bottom: 1px solid rgba(0,0,0,.06);
}

.left-header {
    display: flex;
    align-items: center;

    gap: 28px;
}

.logo {
    font-size: 20px;
    font-weight: 750;

    white-space: nowrap;
}

.nav {
    display: flex;

    gap: 20px;

    color: #6e6e73;

    font-size: 14px;
}

.nav span {
    cursor: pointer;
}

.nav span:hover {
    color: #1d1d1f;
}

.search {
    width: 320px;

    padding: 10px 15px;

    border-radius: 13px;

    background: #f0f0f3;

    color: #86868b;

    font-size: 14px;
}

.user-area {
    display: flex;
    align-items: center;

    gap: 10px;
}

.login-button {
    border: 0;

    padding: 9px 17px;

    border-radius: 12px;

    background: #1d1d1f;

    color: white;

    cursor: pointer;
}

.login-button:hover {
    opacity: .85;
}

.user-avatar {
    display: none;

    width: 38px;
    height: 38px;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #ff9ac8,
            #ff4f92
        );

    color: white;

    font-weight: bold;
}

.user-name {
    display: none;

    font-size: 14px;

    font-weight: 600;
}


/* =========================================================
   页面主体
========================================================= */

.container {
    width: calc(100% - 48px);

    max-width: 1580px;

    margin: 24px auto;
}

.live-layout {
    display: grid;

    grid-template-columns:
        minmax(0,1fr)
        380px;

    gap: 18px;

    align-items: stretch;
}


/* =========================================================
   视频卡片
========================================================= */

.video-card {
    border-radius: 22px;

    overflow: hidden;

    background: rgba(255,255,255,.86);

    border: 1px solid rgba(255,255,255,.9);

    box-shadow:
        0 12px 40px rgba(0,0,0,.07);
}


/* =========================================================
   播放器
========================================================= */

.player {
    width: 100%;

    aspect-ratio: 16 / 9;

    position: relative;

    overflow: hidden;

    background: black;
}

.player iframe {
    width: 100%;
    height: 100%;

    display: block;

    border: 0;
}


/* =========================================================
   左上角直播状态
========================================================= */

.live-overlay {
    position: absolute;

    top: 18px;
    left: 18px;

    z-index: 30;

    display: flex;

    gap: 8px;

    pointer-events: none;
}

.live-badge {
    padding: 7px 11px;

    border-radius: 9px;

    background: #ff375f;

    color: white;

    font-size: 13px;

    font-weight: 700;

    box-shadow:
        0 5px 20px rgba(255,55,95,.28);
}

.viewer-badge {
    padding: 7px 11px;

    border-radius: 9px;

    background: rgba(20,20,20,.62);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    color: white;

    font-size: 13px;
}


/* =========================================================
   播放器右上角工具
========================================================= */

.player-tools {
    position: absolute;

    top: 16px;
    right: 16px;

    z-index: 50;

    display: flex;

    gap: 8px;
}

.player-tool {
    border: 1px solid rgba(255,255,255,.20);

    padding: 7px 12px;

    border-radius: 10px;

    background: rgba(20,20,20,.58);

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    color: white;

    font-size: 13px;

    cursor: pointer;

    transition:
        background .2s,
        transform .2s;
}

.player-tool:hover {
    background: rgba(20,20,20,.76);

    transform: translateY(-1px);
}

.player-tool.active {
    background: rgba(255,70,135,.86);
}


/* =========================================================
   弹幕层
========================================================= */

.danmaku-layer {
    position: absolute;

    inset: 0;

    z-index: 20;

    overflow: hidden;

    pointer-events: none;
}

.danmaku-item {
    position: absolute;

    left: 100%;

    white-space: nowrap;

    padding: 4px 8px;

    border-radius: 7px;

    background: rgba(0,0,0,.12);

    color: #ffffff;

    font-size: 18px;

    font-weight: 650;

    line-height: 26px;

    text-shadow:
        0 1px 2px rgba(0,0,0,1),
        0 0 5px rgba(0,0,0,.85);

    will-change: transform;
}

.danmaku-item.streamer {
    color: #ff9bc2;

    background:
        rgba(255,80,150,.14);
}

.danmaku-item.admin {
    color: #8dc8ff;

    background:
        rgba(75,150,255,.14);
}


/* =========================================================
   直播信息
========================================================= */

.stream-info {
    padding: 23px;
}

.title-line {
    display: flex;

    justify-content: space-between;
    align-items: center;

    gap: 15px;
}

.stream-title {
    margin: 0;

    font-size: 25px;
}

.actions {
    display: flex;

    gap: 8px;
}

.action {
    border: 0;

    border-radius: 12px;

    padding: 9px 16px;

    background: #f2f2f7;

    cursor: pointer;
}

.action:hover {
    background: #e9e9ee;
}

.follow {
    color: #ff2d78;

    background: #fff0f5;
}


/* =========================================================
   主播信息
========================================================= */

.streamer {
    margin-top: 18px;

    display: flex;

    align-items: center;

    gap: 12px;
}

.streamer-avatar {
    width: 50px;
    height: 50px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #ffb6d2,
            #ff6ba5
        );

    color: white;

    font-size: 20px;

    font-weight: 700;
}

.streamer-name {
    font-weight: 700;
}

.streamer-desc {
    margin-top: 4px;

    color: #86868b;

    font-size: 13px;
}


/* =========================================================
   数据栏
========================================================= */

.stats {
    display: grid;

    grid-template-columns:
        repeat(4,1fr);

    margin-top: 20px;

    background: #f5f5f7;

    border-radius: 15px;

    overflow: hidden;
}

.stat {
    text-align: center;

    padding: 13px;

    border-right:
        1px solid rgba(0,0,0,.05);
}

.stat:last-child {
    border-right: 0;
}

.stat-number {
    font-weight: 700;
}

.stat-name {
    margin-top: 3px;

    color: #86868b;

    font-size: 12px;
}


/* =========================================================
   塔菲主题区域
========================================================= */

.character-card {
    margin-top: 18px;

    min-height: 190px;

    border-radius: 22px;

    padding: 26px;

    overflow: hidden;

    position: relative;

    background:
        linear-gradient(
            135deg,
            #fff0f6,
            #f2efff
        );

    box-shadow:
        0 10px 30px rgba(0,0,0,.04);
}

.character-title {
    font-size: 20px;

    font-weight: 700;
}

.character-text {
    width: 55%;

    margin-top: 9px;

    color: #737377;

    line-height: 1.65;

    font-size: 14px;
}

.character-image {
    position: absolute;

    right: 8px;
    bottom: 0;

    max-width: 42%;

    height: 185px;

    object-fit: contain;
}


/* =========================================================
   聊天室
========================================================= */

.chat-card {
    min-height: 690px;

    display: flex;

    flex-direction: column;

    border-radius: 22px;

    overflow: hidden;

    background: rgba(255,255,255,.88);

    border: 1px solid rgba(255,255,255,.9);

    box-shadow:
        0 12px 40px rgba(0,0,0,.07);
}

.chat-header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 18px 19px;

    border-bottom:
        1px solid rgba(0,0,0,.06);
}

.chat-title {
    font-weight: 700;
}

.chat-status {
    font-size: 13px;

    color: #34c759;
}

.notice {
    margin: 14px;

    padding: 13px;

    border-radius: 14px;

    background: #fff1f6;

    border: 1px solid #ffd6e5;

    font-size: 13px;

    line-height: 1.5;
}

.notice strong {
    color: #ff2d78;
}

.messages {
    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding: 5px 17px 15px;
}

.message {
    display: flex;

    gap: 10px;

    margin: 15px 0;
}

.message-avatar {
    width: 32px;
    min-width: 32px;
    height: 32px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #eeeef2;

    font-size: 13px;
}

.message-user {
    font-size: 13px;

    font-weight: 700;
}

.message-user.streamer-name-chat {
    color: #ff3d82;
}

.message-user.admin-name-chat {
    color: #368bd6;
}

.message-time {
    margin-left: 7px;

    color: #aaa;

    font-size: 11px;

    font-weight: normal;
}

.message-text {
    margin-top: 3px;

    color: #424245;

    font-size: 13px;

    line-height: 1.45;

    word-break: break-word;
}

.chat-input-area {
    display: flex;

    gap: 8px;

    padding: 13px;

    border-top:
        1px solid rgba(0,0,0,.06);
}

.chat-input {
    flex: 1;

    min-width: 0;

    border: 0;

    outline: 0;

    padding: 11px 12px;

    border-radius: 13px;

    background: #f2f2f7;
}

.send-button {
    border: 0;

    border-radius: 13px;

    padding: 0 16px;

    background: #ff5b99;

    color: white;

    cursor: pointer;
}

.send-button:hover {
    background: #ff438b;
}


/* =========================================================
   登录 / 注册
========================================================= */

.modal {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 999;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.25);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

.login-card {
    width: 360px;

    max-width: calc(100% - 30px);

    padding: 28px;

    border-radius: 23px;

    background: rgba(255,255,255,.96);

    box-shadow:
        0 30px 80px rgba(0,0,0,.2);
}

.login-card h2 {
    margin-top: 0;

    margin-bottom: 18px;
}

.login-input {
    width: 100%;

    margin-top: 10px;

    padding: 12px;

    border-radius: 12px;

    border: 1px solid #d2d2d7;

    outline: 0;

    background: white;
}

.login-input:focus {
    border-color: #0071e3;
}

.login-submit {
    width: 100%;

    margin-top: 16px;

    border: 0;

    border-radius: 12px;

    padding: 12px;

    background: #0071e3;

    color: white;

    cursor: pointer;
}

.auth-switch {
    text-align: center;

    margin-top: 16px;

    color: #86868b;

    font-size: 13px;
}

.auth-link {
    color: #0071e3;

    cursor: pointer;
}


/* =========================================================
   全屏
========================================================= */

.player:fullscreen {
    width: 100vw;
    height: 100vh;

    aspect-ratio: auto;

    background: black;
}

.player:-webkit-full-screen {
    width: 100vw;
    height: 100vh;

    aspect-ratio: auto;

    background: black;
}


/* =========================================================
   手机
========================================================= */

@media(max-width:1000px) {

    .live-layout {
        grid-template-columns: 1fr;
    }

    .search {
        display: none;
    }

    .chat-card {
        min-height: 540px;
    }

}

@media(max-width:650px) {

    .header {
        padding: 0 15px;
    }

    .nav {
        display: none;
    }

    .container {
        width: 100%;

        margin-top: 0;
    }

    .video-card,
    .chat-card {
        border-radius: 0;
    }

    .stream-info {
        padding: 18px;
    }

    .stream-title {
        font-size: 21px;
    }

    .stats {
        grid-template-columns:
            repeat(2,1fr);
    }

    .player-tools {
        top: 10px;
        right: 10px;
    }

    .player-tool {
        padding: 6px 9px;

        font-size: 12px;
    }

    .live-overlay {
        top: 10px;
        left: 10px;
    }

    .viewer-badge {
        display: none;
    }

    .danmaku-item {
        font-size: 15px;

        line-height: 22px;
    }

    .character-text {
        width: 62%;
    }

}

</style>

</head>

<script>

/* =========================================================
   全局状态
========================================================= */

let currentUser = null;

let currentRole = null;

let chatSocket = null;

let authMode = "login";


/* =========================================================
   弹幕状态
========================================================= */

let danmakuEnabled =
    localStorage.getItem(
        "danmakuEnabled"
    ) !== "false";


let danmakuQueue = [];

let danmakuTrackBusyUntil = [];

let danmakuScheduler = null;


/* 弹幕基础参数 */

const DANMAKU_TRACK_HEIGHT = 34;

const DANMAKU_TOP_RESERVED = 58;

const DANMAKU_BOTTOM_RESERVED = 72;

const DANMAKU_SPEED = 125;

const DANMAKU_GAP = 45;


/* =========================================================
   WebSocket连接
========================================================= */

function connectChat() {

    const protocol =
        location.protocol === "https:"
        ? "wss"
        : "ws";


    const address =
        `${protocol}://${location.hostname}:8765`;


    chatSocket =
        new WebSocket(address);


    chatSocket.onopen =
        function() {

            document.getElementById(
                "chatStatus"
            ).textContent =
                "● 在线";

        };


    chatSocket.onmessage =
        function(event) {

            let data;

            try {

                data =
                    JSON.parse(
                        event.data
                    );

            }

            catch (error) {

                console.error(
                    "无法解析服务器消息",
                    error
                );

                return;

            }


            /* 历史消息 */

            if (
                data.type === "history"
            ) {

                const messages =
                    document.getElementById(
                        "messages"
                    );

                messages.innerHTML =
                    "";


                data.messages.forEach(
                    function(message) {

                        addMessage(
                            message.username,
                            message.text,
                            message.time,
                            message.role
                        );

                    }
                );

            }


            /* 新聊天消息 */

            else if (
                data.type === "chat"
            ) {

                /* 右侧聊天 */

                addMessage(
                    data.username,
                    data.text,
                    data.time,
                    data.role
                );


                /* 同步成为弹幕 */

                addDanmaku(
                    data.username,
                    data.text,
                    data.role
                );

            }


            /* 在线人数 */

            else if (
                data.type === "online"
            ) {

                document.getElementById(
                    "viewerCount"
                ).textContent =
                    data.count;


                document.getElementById(
                    "onlineNumber"
                ).textContent =
                    data.count;

            }


            /* 注册成功 */

            else if (
                data.type ===
                "register_success"
            ) {

                alert(
                    "注册成功，请登录"
                );


                document.getElementById(
                    "password"
                ).value =
                    "";


                showLogin();

            }


            /* 登录成功 */

            else if (
                data.type ===
                "login_success"
            ) {

                currentUser =
                    data.username;


                currentRole =
                    data.role;


                document.getElementById(
                    "loginModal"
                ).style.display =
                    "none";


                document.getElementById(
                    "loginButton"
                ).style.display =
                    "none";


                const avatar =
                    document.getElementById(
                        "userAvatar"
                    );


                avatar.style.display =
                    "flex";


                avatar.textContent =
                    currentUser
                    .charAt(0)
                    .toUpperCase();


                const userName =
                    document.getElementById(
                        "userName"
                    );


                userName.style.display =
                    "block";


                userName.textContent =
                    currentUser;


                document.getElementById(
                    "chatInput"
                ).placeholder =
                    "说点什么吧...";

            }


            /* 登录注册错误 */

            else if (
                data.type ===
                "auth_error"
            ) {

                alert(
                    data.message
                );

            }


            /* 普通错误 */

            else if (
                data.type ===
                "error"
            ) {

                alert(
                    data.message
                );

            }

        };


    chatSocket.onclose =
        function() {

            document.getElementById(
                "chatStatus"
            ).textContent =
                "● 重连中";


            currentUser =
                null;


            currentRole =
                null;


            document.getElementById(
                "loginButton"
            ).style.display =
                "block";


            document.getElementById(
                "userAvatar"
            ).style.display =
                "none";


            document.getElementById(
                "userName"
            ).style.display =
                "none";


            document.getElementById(
                "chatInput"
            ).placeholder =
                "登录后发送消息...";


            setTimeout(
                connectChat,
                2000
            );

        };


    chatSocket.onerror =
        function() {

            document.getElementById(
                "chatStatus"
            ).textContent =
                "● 连接异常";

        };

}


/* =========================================================
   登录 / 注册窗口
========================================================= */

function openLogin() {

    showLogin();


    document.getElementById(
        "loginModal"
    ).style.display =
        "flex";

}


/* 登录模式 */

function showLogin() {

    authMode =
        "login";


    document.getElementById(
        "authTitle"
    ).textContent =
        "登录直播间";


    const submit =
        document.getElementById(
            "authSubmit"
        );


    submit.textContent =
        "登录";


    submit.onclick =
        login;


    document.getElementById(
        "password"
    ).setAttribute(
        "autocomplete",
        "current-password"
    );


    document.getElementById(
        "authSwitch"
    ).innerHTML = `

        还没有账号？

        <span
            class="auth-link"
            onclick="showRegister()"
        >
            注册
        </span>

    `;

}


/* 注册模式 */

function showRegister() {

    authMode =
        "register";


    document.getElementById(
        "authTitle"
    ).textContent =
        "注册账号";


    const submit =
        document.getElementById(
            "authSubmit"
        );


    submit.textContent =
        "注册";


    submit.onclick =
        register;


    document.getElementById(
        "password"
    ).setAttribute(
        "autocomplete",
        "new-password"
    );


    document.getElementById(
        "authSwitch"
    ).innerHTML = `

        已经有账号？

        <span
            class="auth-link"
            onclick="showLogin()"
        >
            返回登录
        </span>

    `;

}


/* =========================================================
   注册
========================================================= */

function register() {

    const username =
        document.getElementById(
            "username"
        ).value.trim();


    const password =
        document.getElementById(
            "password"
        ).value;


    if (
        !username ||
        !password
    ) {

        alert(
            "请输入用户名和密码"
        );

        return;

    }


    if (
        !chatSocket ||
        chatSocket.readyState !==
        WebSocket.OPEN
    ) {

        alert(
            "服务器尚未连接"
        );

        return;

    }


    chatSocket.send(
        JSON.stringify({
            type: "register",
            username: username,
            password: password
        })
    );

}


/* =========================================================
   登录
========================================================= */

function login() {

    const username =
        document.getElementById(
            "username"
        ).value.trim();


    const password =
        document.getElementById(
            "password"
        ).value;


    if (
        !username ||
        !password
    ) {

        alert(
            "请输入用户名和密码"
        );

        return;

    }


    if (
        !chatSocket ||
        chatSocket.readyState !==
        WebSocket.OPEN
    ) {

        alert(
            "服务器尚未连接"
        );

        return;

    }


    chatSocket.send(
        JSON.stringify({
            type: "login",
            username: username,
            password: password
        })
    );

}


/* Enter提交登录 */

function handleAuthEnter(event) {

    if (
        event.key !== "Enter"
    ) {
        return;
    }


    if (
        authMode === "register"
    ) {

        register();

    }

    else {

        login();

    }

}


/* =========================================================
   发送聊天
========================================================= */

function sendMessage() {

    const input =
        document.getElementById(
            "chatInput"
        );


    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    if (!currentUser) {

        openLogin();

        return;

    }


    if (
        !chatSocket ||
        chatSocket.readyState !==
        WebSocket.OPEN
    ) {

        alert(
            "聊天室尚未连接"
        );

        return;

    }


    chatSocket.send(
        JSON.stringify({
            type: "chat",
            text: text
        })
    );


    input.value =
        "";

}


/* Enter发送聊天 */

function handleChatEnter(event) {

    if (
        event.key === "Enter"
    ) {

        sendMessage();

    }

}


/* =========================================================
   显示聊天室消息
========================================================= */

function addMessage(
    username,
    text,
    time,
    role
) {

    const messages =
        document.getElementById(
            "messages"
        );


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message";


    const avatar =
        document.createElement(
            "div"
        );


    avatar.className =
        "message-avatar";


    avatar.textContent =
        username
        .charAt(0)
        .toUpperCase();


    const body =
        document.createElement(
            "div"
        );


    const user =
        document.createElement(
            "div"
        );


    user.className =
        "message-user";


    if (
        role === "streamer"
    ) {

        user.classList.add(
            "streamer-name-chat"
        );


        user.textContent =
            "👑 " +
            username;

    }

    else if (
        role === "admin"
    ) {

        user.classList.add(
            "admin-name-chat"
        );


        user.textContent =
            "🛡 " +
            username;

    }

    else {

        user.textContent =
            username;

    }


    if (time) {

        const clock =
            document.createElement(
                "span"
            );


        clock.className =
            "message-time";


        clock.textContent =
            time;


        user.appendChild(
            clock
        );

    }


    const content =
        document.createElement(
            "div"
        );


    content.className =
        "message-text";


    /*
       使用 textContent，
       防止聊天消息执行 HTML/JavaScript
    */

    content.textContent =
        text;


    body.appendChild(
        user
    );


    body.appendChild(
        content
    );


    row.appendChild(
        avatar
    );


    row.appendChild(
        body
    );


    messages.appendChild(
        row
    );


    messages.scrollTop =
        messages.scrollHeight;

}


/* =========================================================
   弹幕开关
========================================================= */

function updateDanmakuButton() {

    const button =
        document.getElementById(
            "danmakuToggle"
        );


    if (
        danmakuEnabled
    ) {

        button.textContent =
            "弹幕 开";


        button.classList.add(
            "active"
        );


        button.setAttribute(
            "aria-pressed",
            "true"
        );

    }

    else {

        button.textContent =
            "弹幕 关";


        button.classList.remove(
            "active"
        );


        button.setAttribute(
            "aria-pressed",
            "false"
        );

    }

}


function toggleDanmaku() {

    danmakuEnabled =
        !danmakuEnabled;


    localStorage.setItem(
        "danmakuEnabled",
        danmakuEnabled
    );


    updateDanmakuButton();


    /*
       关闭时清除当前屏幕上的弹幕和排队弹幕
    */

    if (
        !danmakuEnabled
    ) {

        danmakuQueue =
            [];


        const layer =
            document.getElementById(
                "danmakuLayer"
            );


        layer.innerHTML =
            "";

    }

}


/* =========================================================
   弹幕轨道
========================================================= */

function getDanmakuTrackCount() {

    const layer =
        document.getElementById(
            "danmakuLayer"
        );


    if (!layer) {
        return 0;
    }


    const usableHeight =
        layer.clientHeight
        -
        DANMAKU_TOP_RESERVED
        -
        DANMAKU_BOTTOM_RESERVED;


    return Math.max(
        1,
        Math.floor(
            usableHeight /
            DANMAKU_TRACK_HEIGHT
        )
    );

}


/* 保证轨道数组长度正确 */

function ensureDanmakuTracks() {

    const count =
        getDanmakuTrackCount();


    if (
        danmakuTrackBusyUntil.length
        !==
        count
    ) {

        const old =
            danmakuTrackBusyUntil;


        danmakuTrackBusyUntil =
            new Array(
                count
            ).fill(0);


        for (
            let i = 0;
            i <
            Math.min(
                count,
                old.length
            );
            i++
        ) {

            danmakuTrackBusyUntil[i] =
                old[i];

        }

    }

}


/* =========================================================
   添加弹幕
========================================================= */

function addDanmaku(
    username,
    text,
    role
) {

    if (
        !danmakuEnabled
    ) {
        return;
    }


    /*
       防止超长弹幕严重挡屏
    */

    let displayText =
        text;


    if (
        displayText.length >
        80
    ) {

        displayText =
            displayText.slice(
                0,
                80
            )
            +
            "…";

    }


    danmakuQueue.push({
        username:
            username,

        text:
            displayText,

        role:
            role
    });


    pumpDanmakuQueue();

}


/* =========================================================
   弹幕调度器
========================================================= */

function pumpDanmakuQueue() {

    if (
        !danmakuEnabled
    ) {
        return;
    }


    ensureDanmakuTracks();


    const now =
        performance.now();


    let freeTrack =
        -1;


    for (
        let i = 0;
        i <
        danmakuTrackBusyUntil.length;
        i++
    ) {

        if (
            danmakuTrackBusyUntil[i]
            <=
            now
        ) {

            freeTrack =
                i;

            break;

        }

    }


    /*
       当前没有空轨道，
       等待下一轮
    */

    if (
        freeTrack === -1
    ) {

        scheduleDanmakuPump();

        return;

    }


    const data =
        danmakuQueue.shift();


    if (!data) {
        return;
    }


    launchDanmaku(
        data,
        freeTrack
    );


    /*
       如果还有排队消息，
       继续尝试
    */

    if (
        danmakuQueue.length >
        0
    ) {

        pumpDanmakuQueue();

    }

}


/* 定时检查空轨道 */

function scheduleDanmakuPump() {

    if (
        danmakuScheduler
    ) {
        return;
    }


    danmakuScheduler =
        setTimeout(
            function() {

                danmakuScheduler =
                    null;


                pumpDanmakuQueue();

            },
            100
        );

}


/* =========================================================
   真正发射一条弹幕
========================================================= */

function launchDanmaku(
    data,
    track
) {

    const layer =
        document.getElementById(
            "danmakuLayer"
        );


    if (
        !layer ||
        !danmakuEnabled
    ) {
        return;
    }


    const item =
        document.createElement(
            "div"
        );


    item.className =
        "danmaku-item";


    if (
        data.role === "streamer"
    ) {

        item.classList.add(
            "streamer"
        );


        item.textContent =
            "👑 " +
            data.username +
            "：" +
            data.text;

    }

    else if (
        data.role === "admin"
    ) {

        item.classList.add(
            "admin"
        );


        item.textContent =
            "🛡 " +
            data.username +
            "：" +
            data.text;

    }

    else {

        item.textContent =
            data.username +
            "：" +
            data.text;

    }


    const top =
        DANMAKU_TOP_RESERVED
        +
        track *
        DANMAKU_TRACK_HEIGHT;


    item.style.top =
        top +
        "px";


    layer.appendChild(
        item
    );


    /*
       append 后才能取得实际宽度
    */

    const itemWidth =
        item.offsetWidth;


    const layerWidth =
        layer.clientWidth;


    /*
       固定速度，
       不同长度弹幕速度基本一致
    */

    const totalDistance =
        layerWidth
        +
        itemWidth
        +
        30;


    const duration =
        totalDistance
        /
        DANMAKU_SPEED
        *
        1000;


    /*
       当前轨道什么时候可以发下一条？
       等上一条右边缘离开出生位置一段距离即可。
    */

    const safeDelay =
        (
            itemWidth
            +
            DANMAKU_GAP
        )
        /
        DANMAKU_SPEED
        *
        1000;


    danmakuTrackBusyUntil[
        track
    ] =
        performance.now()
        +
        safeDelay;


    /*
       使用浏览器 Animation API
       从右向左移动
    */

    const animation =
        item.animate(
            [
                {
                    transform:
                        "translateX(0)"
                },
                {
                    transform:
                        `translateX(-${totalDistance}px)`
                }
            ],
            {
                duration:
                    duration,

                easing:
                    "linear",

                fill:
                    "forwards"
            }
        );


    animation.onfinish =
        function() {

            item.remove();

        };


    /*
       当前轨道释放后继续检查队列
    */

    setTimeout(
        function() {

            pumpDanmakuQueue();

        },
        safeDelay +
        20
    );

}


/* =========================================================
   自定义全屏
========================================================= */

function toggleFullscreen() {

    const player =
        document.getElementById(
            "player"
        );


    if (
        !document.fullscreenElement
    ) {

        if (
            player.requestFullscreen
        ) {

            player.requestFullscreen();

        }

        else if (
            player.webkitRequestFullscreen
        ) {

            player.webkitRequestFullscreen();

        }

    }

    else {

        if (
            document.exitFullscreen
        ) {

            document.exitFullscreen();

        }

        else if (
            document.webkitExitFullscreen
        ) {

            document.webkitExitFullscreen();

        }

    }

}

   点击背景关闭登录框
========================================================= */

document.getElementById(
    "loginModal"
).addEventListener(

        if (
            event.target === this
        ) {

   窗口大小改变
========================================================= */

window.addEventListener(
    "resize",
    function() {

        ensureDanmakuTracks();

    }
);


/* =========================================================
   页面启动
========================================================= */

updateDanmakuButton();

ensureDanmakuTracks();

connectChat();

</script>
